# Server Configuration
server.port=${PORT:8081}

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# AWS S3 Configuration
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.bucket-name=${AWS_BUCKET_NAME:cloudbox-file-storage}
aws.region=${AWS_REGION:us-east-1}

# Logging
logging.level.com.cloudbox=DEBUG

# Error response configuration
server.error.include-message=always

# Appwrite authentication
appwrite.endpoint=${APPWRITE_ENDPOINT:https://nyc.cloud.appwrite.io/v1}
appwrite.project-id=${APPWRITE_PROJECT_ID:6ae1dd7d002110adc224}